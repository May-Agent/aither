[workspace]
resolver = "2"

members = [
    "apple",
    "attachments",
    "claude",
    "cloud",
    "codex",
    "copilot",
    "derive",
    "openai",
    "core",
    "gemini",
    "llama",
    "ort",
    "agent",
    "connectivity",
    "rag",
    "mem0",
    "skills",
    "models",
    "tools/browser",
    "tools/dap",
    "tools/websearch",
    "tools/webfetch",
    "tools/search",
    "tools/fs",
    "tools/command",
    "mcp",
    "acp",
    "cli",
    "sandbox",
]

[workspace.package]
version = "0.31.0"
edition = "2024"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "MIT"
repository = "https://github.com/May-Agent/aither"
rust-version = "1.100"

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
cargo.unused_dependencies = "deny"
cargo.unused_workspace_dependencies = "deny"
cargo.missing_lints_inheritance = "deny"
clippy.all = { level = "warn", priority = -1 }
clippy.style = { level = "warn", priority = -1 }
clippy.correctness = { level = "warn", priority = -1 }
clippy.complexity = { level = "warn", priority = -1 }
clippy.suspicious = { level = "warn", priority = -1 }
clippy.perf = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }
clippy.nursery = { level = "warn", priority = -1 }
clippy.cargo = { level = "warn", priority = -1 }
clippy.disallowed_methods = "deny"
clippy.multiple_crate_versions = { level = "allow", priority = 1}

[workspace.dependencies]
arc-swap = "1"
tracing = "0.1.44"
zenwave = { version = "0.7", default-features = false }
aither-core = { path = "./core", version = "0.31.0" }
aither-apple = { path = "./apple", version = "0.31.0" }
aither-derive = { path = "./derive", version = "0.31.0" }
aither-ort = { path = "./ort", version = "0.31.0" }
aither-skills = { path = "./skills", version = "0.31.0" }
aither-attachments = { path = "./attachments", version = "0.31.0" }
aither-browser = { path = "./tools/browser", version = "0.31.0" }
aither-dap = { path = "./tools/dap", version = "0.31.0" }
aither-websearch = { path = "./tools/websearch", version = "0.31.0" }
aither-webfetch = { path = "./tools/webfetch", version = "0.31.0" }
aither-search = { path = "./tools/search", version = "0.31.0" }
aither-fs = { path = "./tools/fs", version = "0.31.0" }
aither-command = { path = "./tools/command", version = "0.31.0" }
aither-mcp = { path = "./mcp", version = "0.31.0" }
aither-acp = { path = "./acp", version = "0.31.0" }
aither-connectivity = { path = "./connectivity", version = "0.31.0" }
aither-agent = { path = "./agent", version = "0.31.0", default-features = false }
aither-openai = { path = "./openai", version = "0.31.0" }
aither-claude = { path = "./claude", version = "0.31.0" }
aither-cloud = { path = "./cloud", version = "0.31.0" }
aither-gemini = { path = "./gemini", version = "0.31.0" }
aither-llama = { path = "./llama", version = "0.31.0" }
aither-copilot = { path = "./copilot", version = "0.31.0" }
aither-codex = { path = "./codex", version = "0.31.0" }
aither-models = { path = "./models", version = "0.31.0" }
aither-rag = { path = "./rag", version = "0.31.0" }
aither-mem0 = { path = "./mem0", version = "0.31.0" }

[dependencies]
aither-core = { workspace = true, default-features = false }
aither-derive = { workspace = true, optional = true }

# Provider integrations
aither-openai = { workspace = true, optional = true }
aither-claude = { workspace = true, optional = true }
aither-gemini = { workspace = true, optional = true }
aither-llama = { workspace = true, optional = true }
aither-ort = { workspace = true, optional = true }

# High-level features
aither-agent = { workspace = true, optional = true, default-features = true }
aither-rag = { workspace = true, optional = true }
aither-connectivity = { workspace = true, optional = true }
aither-mem0 = { workspace = true, optional = true }
aither-skills = { workspace = true, optional = true }

# Tools
aither-browser = { workspace = true, optional = true }
aither-dap = { workspace = true, optional = true }
aither-websearch = { workspace = true, optional = true }
aither-webfetch = { workspace = true, optional = true }
aither-search = { workspace = true, optional = true }
aither-fs = { workspace = true, optional = true }
aither-command = { workspace = true, optional = true }

# MCP
aither-mcp = { workspace = true, optional = true }

# Apple Intelligence only exists on macOS/iOS; the crate itself compiles
# elsewhere but the facade must not pretend the provider is wired up. Keep
# this table after the full dependency list so nothing else is scoped.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
aither-apple = { workspace = true, optional = true }


[dev-dependencies]
aither-codex.workspace = true
aither-openai.workspace = true
aither-gemini.workspace = true
aither-mem0.workspace = true
aither-webfetch.workspace = true
aither-rag.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4"
schemars = { version = "1.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-lite = { version = "2.6" }
crossterm = "0.29"

[package]
name = "aither"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Providing unified trait abstractions for AI models"
documentation = "https://docs.rs/aither"
keywords = ["ai", "llm", "embedding", "image-generation", "no-std"]
categories = ["api-bindings", "no-std"]
readme = "./README.md"
exclude = [
    ".github/",
    ".gitignore",
    "target/",
]


[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "derive", "serde"]
std = ["aither-core/std"]
serde = ["aither-core/serde"]
derive = ["dep:aither-derive", "aither-core/derive"]

# Provider integrations
openai = ["dep:aither-openai"]
claude = ["dep:aither-claude"]
gemini = ["dep:aither-gemini"]
llama = ["dep:aither-llama"]
ort = ["dep:aither-ort"]
apple = ["dep:aither-apple"]

# High-level features
agent = ["dep:aither-agent"]
rag = ["dep:aither-rag"]
connectivity = ["dep:aither-connectivity"]
mem0 = ["dep:aither-mem0"]
skills = ["dep:aither-skills"]

# Tools
browser = ["dep:aither-browser"]
dap = ["dep:aither-dap"]
websearch = ["dep:aither-websearch"]
webfetch = ["dep:aither-webfetch"]
search = ["dep:aither-search"]
fs = ["dep:aither-fs"]
command = ["dep:aither-command"]

# MCP
mcp = ["dep:aither-mcp"]

# Convenience feature to enable all providers
all-providers = ["openai", "claude", "gemini", "llama", "ort", "apple"]

# Convenience feature to enable all tools
all-tools = ["browser", "dap", "websearch", "webfetch", "search", "fs", "command"]

# Convenience feature to enable everything
full = ["std", "derive", "serde", "all-providers", "all-tools", "agent", "rag", "mem0", "skills", "mcp", "connectivity"]

[lints]
workspace = true
