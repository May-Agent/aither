[package]
name = "aither-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI agent framework with planning, memory, and tool execution for aither"
readme = "../README.md"
keywords = ["ai", "agent", "llm", "planning"]
categories = ["api-bindings"]
# The model conversion tooling is not part of the crate.
exclude = ["convert"]

[dependencies]
dunce = { version = "1.0.5", default-features = false }
aither-core.workspace = true
aither-attachments.workspace = true
aither-sandbox.workspace = true
executor-core = "0.7"
anyhow = "1.0.104"
askama = "0.16"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
sync_wrapper = "1"
serde_json = "1.0"
basic-toml = { version = "0.1.10", default-features = false }
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
async-fs = "2"
async-channel = "2"
async-io = "2"
async-process = "2"
arc-swap = "1"
aho-corasick = { version = "1.1.5", default-features = false, features = ["std", "perf-literal"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
blocking = { version = "1.7.0", default-features = false }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
event-listener = "5"
aither-websearch = { workspace = true, optional = true }
aither-webfetch = { workspace = true, optional = true }
aither-fs = { workspace = true, optional = true }
aither-command = { workspace = true, optional = true }
aither-mcp = { workspace = true, optional = true }
aither-skills = { workspace = true, optional = true }
aither-connectivity = { workspace = true, optional = true }
async-stream = "0.3.6"
futures = "0.3"
futures-core = "0.3.34"
futures-lite = "2.6"
sha2 = "0.11"
similar = "3"
uuid = { version = "1", features = ["v4"] }
num-traits = "0.2"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
# The language detector runs a small model, downloaded on first use through
# `ondevice`'s pinned, verified store: Core ML on Apple platforms, ONNX Runtime
# elsewhere (below).
ondevice = { version = "0.0.1", optional = true, default-features = false, features = ["zenwave"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
isolang = { version = "2.4", optional = true, default-features = false, features = ["english_names", "lowercase_names", "local_names"] }
# The per-user cache directory the model is kept in.
dirs = { version = "6", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# The compiled model is an archive.
ondevice = { version = "0.0.1", optional = true, default-features = false, features = ["archive", "zenwave"] }
ondevice-coreml = { version = "0.0.1", optional = true, default-features = false }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
# `ort` is held at rc.12 to match `magika`, which pins it exactly;
# `download-binaries` obtains ONNX Runtime the way sandbox's `code-folding` does.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }
# `statvfs` for the free space of a volume; macOS also reads its memory
# pressure and load average through it.
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
hex = "0.4"
aither-sandbox = { workspace = true, features = ["test-git", "test-ids"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
url = "2.5.8"
aither-openai.workspace = true
# An in-process MCP server drives the command table through a real connection.
aither-mcp = { workspace = true, default-features = false, features = ["client"] }

[features]
default = []
websearch = ["dep:aither-websearch"]
webfetch = ["dep:aither-webfetch"]
filesystem = ["dep:aither-fs"]
command = ["dep:aither-command"]
mcp = ["dep:aither-mcp"]
skills = ["dep:aither-skills"]
languages = ["dep:ondevice", "dep:ort", "dep:ondevice-coreml", "dep:tokenizers", "dep:isolang", "dep:dirs"]
connectivity = ["dep:aither-connectivity", "aither-sandbox/connectivity"]
full = ["websearch", "webfetch", "filesystem", "command", "mcp", "skills", "languages", "connectivity"]

[lints]
workspace = true
