[package]
name = "aither-cloud"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Unified cloud provider supporting OpenAI, Anthropic Claude, and Google Gemini"
readme = "README.md"
keywords = ["ai", "llm", "openai", "claude", "gemini"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true
aither-claude.workspace = true
aither-copilot.workspace = true
aither-codex.workspace = true
aither-gemini.workspace = true
aither-openai.workspace = true
async-stream = "0.3"
futures-core = "0.3"
futures-lite = "2.6"
schemars = { version = "1.2", default-features = false }
serde = { version = "1.0", default-features = false }
thiserror = "2"

[dev-dependencies]
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
