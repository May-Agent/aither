[package]
name = "aither-acp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ACP (Agent Client Protocol) client and server for aither"
readme = "../README.md"
keywords = ["ai", "agent", "acp", "editor-integration"]
categories = ["api-bindings"]

[features]
default = ["agent"]
agent = ["dep:aither-agent", "dep:aither-core", "dep:askama", "dep:base64", "dep:uuid"]

[dependencies]
aither-core = { workspace = true, optional = true }
aither-agent = { workspace = true, optional = true, default-features = false, features = ["mcp"] }
aither-mcp.workspace = true
askama = { version = "0.16", optional = true }
base64 = { version = "0.23", optional = true }
executor-core = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
futures-util = "0.3"
async-channel = "2"
async-process = "2"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", optional = true, features = ["v4"] }

[[test]]
name = "child_agent"
required-features = ["agent"]

[[test]]
name = "session_mcp"
required-features = ["agent"]

[dev-dependencies]
executor-core = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
