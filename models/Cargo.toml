[package]
name = "aither-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model registry with capabilities, context windows, and metadata for popular LLMs"
readme = "../README.md"
keywords = ["llm", "ai", "models", "registry"]
categories = ["data-structures"]

[dependencies]
aither-core.workspace = true
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, optional = true }
async-fs = { version = "2", default-features = false, optional = true }
zenwave = { workspace = true, optional = true, features = ["hyper-backend", "rustls"] }

[build-dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt"] }

[features]
default = []
remote = ["dep:zenwave", "dep:async-fs", "dep:thiserror"]

[lints]
workspace = true
