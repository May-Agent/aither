# A hung test fails within minutes instead of holding its job until the job
# timeout. The slowest test takes about 35 s on any CI platform.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# A hung process-tree test fails within seconds instead of holding the job
# until its timeout; these tests normally finish in under 4 s.
[[profile.default.overrides]]
filter = 'package(aither-sandbox) & test(/^process_tree::/)'
slow-timeout = { period = "10s", terminate-after = 3 }

# The headless webfetch tests each launch Chrome. The first start on a fresh
# runner is the slow one (see `BROWSER_LAUNCH_TIMEOUT`). Several such starts
# at once took longer than any of them alone, so they run one at a time.
[test-groups]
headless-browser = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(aither-webfetch) & test(/^headless_tests::/)'
test-group = 'headless-browser'
