[package]
name = "aither-patch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "apply_patch: sandbox-executed compact contextual patch utility"
readme = "../README.md"
keywords = ["patch", "diff", "sandbox", "agent", "tooling"]
categories = ["command-line-utilities"]
# Removed from crates.io: the program now ships from May (May-Agent/may#1015)
# and is never published again.
publish = false

[dependencies]
thiserror = "2"

[[bin]]
name = "apply_patch"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
