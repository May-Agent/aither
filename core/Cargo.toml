[package]
name = "aither-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core trait abstractions for aither"
readme = "../README.md"
keywords = ["ai", "llm", "traits", "no-std"]
categories = ["api-bindings", "no-std"]

[dependencies]
aither-derive = { workspace = true, optional = true }
anyhow = { version = "1.0", default-features = false }
askama = { version = "0.16", default-features = false, features = ["alloc", "derive"] }
event-listener = { version = "5.4.2", default-features = false }
futures-core = { version = "0.3.34", default-features = false, features = ["alloc"] }
futures-lite = { version = "2.6", default-features = false, features = ["alloc"] }
httpdate = { version = "1.0", optional = true }
mime = "0.3"
schemars = { version = "1.2", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.21", default-features = false }
url = { version = "2.5", default-features = false }
zenwave = { workspace = true, optional = true, features = ["hyper-backend", "rustls"] }
tiktoken = { version = "4", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = { version = "0.22", optional = true, default-features = false }
num-traits = { version = "0.2", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = { version = "2.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
async-channel = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4"
schemars = { version = "1.2" }
serde = { version = "1.0", features = ["derive"] }
futures-lite = { version = "2.6" }

[features]
default = ["std", "derive", "serde"]
std = [
    "anyhow/std",
    "event-listener/std",
    "futures-core/std",
    "futures-lite/std",
    "schemars/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
    "url/std",
]
serde = ["serde/derive", "url/serde"]
derive = ["dep:aither-derive"]
# HTTP failure classification for providers built on zenwave.
zenwave = ["std", "dep:zenwave", "dep:httpdate"]
# A runtime-agnostic `time::sleep` that also runs on wasm32.
timer = ["std", "dep:async-io", "dep:gloo-timers", "dep:wasm-bindgen-futures", "dep:async-channel"]
# Exact in-process token counting; each vocab feature pulls its embedded
# vocabulary from the `tiktoken` crate.
tokenizer = ["std", "dep:num-traits", "dep:tiktoken", "dep:image", "dep:base64", "base64/std", "num-traits/std"]
vocab-o200k = ["tokenizer", "tiktoken/vocab-o200k_base"]
vocab-cl100k = ["tokenizer", "tiktoken/vocab-cl100k_base"]
vocab-deepseek = ["tokenizer", "tiktoken/vocab-deepseek_v3"]
vocab-llama = ["tokenizer", "tiktoken/vocab-llama3"]
vocab-mistral = ["tokenizer", "tiktoken/vocab-mistral_v3"]
vocab-qwen = ["tokenizer", "tiktoken/vocab-qwen2"]

[lints]
workspace = true
