[package]
name = "aither-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command execution tool for aither agents"
readme = "../../README.md"
keywords = ["ai", "agent", "tool", "command"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true
anyhow = "1.0"
askama = "0.16"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
async-process = "2.5"
futures-lite = { version = "2.6", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
tokio = { version = "1.53", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
