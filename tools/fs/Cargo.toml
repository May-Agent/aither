[package]
name = "aither-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Filesystem access tool for aither agents"
readme = "../../README.md"
keywords = ["ai", "agent", "tool", "filesystem"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true
askama = "0.16"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
async-fs = "2.2.0"
blocking = { version = "1.7", default-features = false }
futures-lite = "2.6"
glob = "0.3"
arc-swap = "1.9"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
