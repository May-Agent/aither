name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # A pull request pushed with GITHUB_TOKEN (release-plz's) starts no
  # pull_request run, so CI is started on its branch by hand.
  workflow_dispatch:

# Keyed per event, so a branch with a pull request open runs the suite twice --
# once for the push, once for the pull request. Keying on the head branch
# instead does collapse the pair, but it collapses it by CANCELLING one, and a
# cancelled job reports as a failed check against the commit. The branch then
# reads as broken when it is fine, and how much of the run got cancelled
# decides how red it looks. Minutes are free on a public repository; a red tick
# on a release branch is not. Within a single event a run still cancels the one
# it supersedes, which is the case that actually wastes a runner. A main push
# run is the only one that saves the Rust caches, so main runs queue instead:
# cancelling one mid-build leaves no cache for the runs after it. A newer
# push still replaces a main run that has not started.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------- scope
  # Which crates this change can reach: the changed crates plus everything that
  # depends on them. A pull request measures against its base branch; every
  # other event (a push to main, a merge group, a dispatch) names no base, so
  # the tool selects the whole workspace and the full suite runs: the queue
  # tests the exact commit that lands on main. Workflows, the toolchain, the
  # lockfile, cargo and nextest configuration, and any path the rules do not
  # name select the whole workspace; prose selects nothing
  # (.github/affected-rules.toml).
  #
  # Scoped runs keep main's cache-saved feature resolution where they can: build
  # commands keep their `--workspace` / `--all-features` flags, and the test
  # jobs narrow only which tests run, with a nextest filterset. A cargo `-p` or
  # `--exclude` list changes which packages' features are unified into the
  # dependency graph, which changes build units and misses the cache, so no
  # job narrows its build that way.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workspace: ${{ steps.jobs.outputs.workspace }}
      packages: ${{ steps.scope.outputs.packages }}
      package-args: ${{ steps.scope.outputs.package-args }}
      features: ${{ steps.jobs.outputs.features }}
      rust: ${{ steps.jobs.outputs.rust }}
      wasm: ${{ steps.jobs.outputs.wasm }}
      apple: ${{ steps.jobs.outputs.apple }}
      filterset: ${{ steps.jobs.outputs.filterset }}
    steps:
      # The tool diffs from the merge-base with the base branch, which needs
      # the history rather than a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: scope
        uses: lexoliu/affected-crates@v0.0.0
        with:
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          rules: .github/affected-rules.toml
      # Turns the affected set into what each job reads. `rust` is any affected
      # crate (nothing at all for a prose-only change); `wasm` and `apple`
      # are true when a crate the matching job builds is affected, which
      # a changed dependency of it also makes true. `filterset` narrows nextest
      # to the affected packages and is empty for the whole workspace.
      # `features` is `rust`: every change lands on main, so every change gets
      # the feature checks.
      - id: jobs
        env:
          WORKSPACE: ${{ steps.scope.outputs.workspace }}
          PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set -euo pipefail
          rust=$([ "${WORKSPACE}" = true ] || [ -n "${PACKAGES}" ] && echo true || echo false)
          has() {
            [ "${WORKSPACE}" = true ] && return 0
            for want in "$@"; do
              case " ${PACKAGES} " in *" ${want} "*) return 0 ;; esac
            done
            return 1
          }
          flag() { if "$@"; then echo true; else echo false; fi; }
          filterset=""
          if [ "${WORKSPACE}" != true ]; then
            for name in ${PACKAGES}; do
              filterset="${filterset:+${filterset} | }package(=${name})"
            done
          fi
          {
            echo "workspace=${WORKSPACE}"
            echo "features=${rust}"
            echo "rust=${rust}"
            echo "wasm=$(flag has aither-core aither-openai aither-gemini aither-claude)"
            echo "apple=$(flag has aither-apple)"
            echo "filterset=${filterset}"
          } >> "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------- fast gates
  # These need no build, so they answer in seconds and catch the cheap mistakes
  # before anyone waits on a compile.
  audit:
    name: Security Audit
    needs: scope
    if: needs.scope.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # audit-check reports through a check run, which the default read-only
    # token cannot create: without this the audit itself passes and the step
    # then fails on "Resource not accessible by integration", which reads like
    # a vulnerability was found when none was.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  format:
    name: Format
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  workflow-gates:
    name: Workflow Gates
    needs: scope
    if: needs.scope.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with PyYAML==6.0.3 python .github/tests/test_ci_waiters.py

  unused-deps:
    name: Unused Dependencies
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  # ------------------------------------------------------------------ the build
  # Lint carries every feature because a `#[cfg]` branch nobody compiles is a
  # branch nobody lints, and platform-gated code is where that bites.
  lint:
    name: Lint
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only main saves caches. A pull request restores main's and saves none:
      # its copy would be reachable from that pull request alone, and those
      # copies push main's caches past the repository limit, where they are
      # evicted and every job compiles from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-ubuntu
      - uses: ./.github/actions/install-protoc
      - run: cargo clippy --all-targets --all-features --timings -- -D warnings
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-ci-lint
          path: target/cargo-timings/

  wasm:
    name: WASM
    needs: scope
    if: needs.scope.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-wasm
      # `aither` itself is not wasm-buildable: the agent, sandbox, and CLI need
      # a filesystem and processes. Build the crates that are meant to run in a
      # browser, and deny warnings so a native-only helper cannot quietly rot
      # into dead code on this target.
      - run: cargo build --target wasm32-unknown-unknown -p aither-core -p aither-openai -p aither-gemini -p aither-claude --timings
        env:
          RUSTFLAGS: "-D warnings"
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-ci-wasm
          path: target/cargo-timings/

  # ------------------------------------------------------------------- testing
  # Split in two. Portability is what the three-platform matrix is for, and it
  # answers quickly because it skips the backends that compile C++ from source.
  # Breadth runs once, on the platform where runner disk can be reclaimed.
  # `--workspace` builds every member whatever the root crate's features say, so
  # the heavy backends have to be excluded by package, not by feature: doing it
  # this way compiles 132 packages instead of 487.
  test-portability:
    name: Test
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    uses: ./.github/workflows/test.yml
    with:
      flags: >-
        --workspace
        --exclude aither-llama --exclude aither-ort
        --exclude aither-rag --exclude aither-search
        --exclude aither-apple
        --no-default-features --features derive,serde,agent,mcp,skills
      cache-key: portable
      filterset: ${{ needs.scope.outputs.filterset }}
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'

  # aither-apple compiles a Swift bridge against the Foundation Models
  # framework, so it gets its own lane on a runner with the Foundation Models
  # SDK rather than sharing the portability matrix. Xcode 27 supplies the
  # public context-size query back-deployed to OS 26. The SDK 27 / OS 27 image
  # runs deterministic native tests while deployment targets remain OS 26.
  test-apple:
    name: Apple Intelligence (native)
    needs: scope
    if: needs.scope.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-apple
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked -p aither-apple --features test --run-ignored all --timings
      - run: cargo clippy -p aither-apple --all-targets --features test --timings -- -D warnings
      - run: cargo test --doc -p aither-apple --timings
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-ci-test-apple
          path: target/cargo-timings/

  test-full:
    name: Test (all features)
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    uses: ./.github/workflows/test.yml
    with:
      flags: --workspace --all-features
      cache-key: full
      filterset: ${{ needs.scope.outputs.filterset }}
      os: '["ubuntu-latest"]'
      free-disk: true

  # `cargo hack` expands both flags into one `cargo check` per feature
  # combination, and over a 25-crate workspace that list cannot finish inside
  # one job's timeout — every run was being cancelled at 45 minutes.
  # `--partition k/8` cuts each invocation's command list into eight
  # contiguous slices of equal length, so every job runs slice k of every
  # invocation below and the eight jobs together run each command once.
  feature-checks:
    name: Features (${{ matrix.part }}/8)
    needs: scope
    if: needs.scope.outputs.features == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Aliases that only union other features.
      AGGREGATE_FEATURES: all-providers,all-tools,full
      # Features whose dependency graph costs minutes per distinct feature set:
      # llama rebuilds llama.cpp, search re-checks the lance/datafusion/arrow
      # stack. Their combinations sit next to each other in cargo-hack's order,
      # so slicing one list by count put all of search's pairs in one job.
      # Slicing them as their own list spreads them over all eight jobs.
      # `--at-least-one-of` needs two or more features.
      HEAVY_FEATURES: search,llama
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Each partition gets its own cache: eight jobs sharing one key
          # would evict each other's artifacts on every save.
          shared-key: ci-features-${{ matrix.part }}
      - uses: ./.github/actions/install-protoc
      - uses: taiki-e/install-action@cargo-hack
      # `--each-feature` is `--all-features`, `--no-default-features` and every
      # feature alone. The depth-2 powerset below already runs the latter two
      # for every non-aggregate feature, so only `--all-features` and the
      # aggregates alone are left to run here.
      - run: cargo hack check --all-features --no-dev-deps --timings --partition ${{ matrix.part }}/8
      - run: cargo hack check --each-feature --include-features "$AGGREGATE_FEATURES" --no-dev-deps --timings --partition ${{ matrix.part }}/8
      # The full powerset of this crate's 20 features is 89,766 `cargo check`
      # runs, which no CI job can finish. Depth 2 covers every pair of features
      # — where feature-interaction bugs actually live — in 209 runs. The three
      # aggregate aliases are unions of features already covered individually
      # and pairwise, and are what makes the full powerset explode. The two
      # steps split that one list into the combinations with a heavy feature
      # and those without one, so together they run each combination once.
      - run: cargo hack check --feature-powerset --depth 2 --exclude-features "$AGGREGATE_FEATURES" --at-least-one-of "$HEAVY_FEATURES" --no-dev-deps --timings --partition ${{ matrix.part }}/8
      - run: cargo hack check --feature-powerset --depth 2 --exclude-features "$AGGREGATE_FEATURES,$HEAVY_FEATURES" --no-dev-deps --timings --partition ${{ matrix.part }}/8
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-ci-features-${{ matrix.part }}
          path: target/cargo-timings/

  # ------------------------------------------------------------------ coverage
  # Instrumented builds cost roughly double, and coverage of a crate that is
  # mostly bindings to C++ measures the binding rather than anything worth
  # knowing, so llama and ort stay out of it.
  coverage:
    name: Coverage
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The sandbox tests download pinned tools from GitHub releases; the job
      # token authenticates them.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ci-coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/install-protoc
      # The fish login shell case of the sandbox's SSH tests runs only where
      # fish is installed.
      - name: Install fish
        run: sudo apt-get install -y --no-install-recommends fish
      # `full` would re-enable llama and ort, and --exclude only skips testing
      # a package, not building it as a dependency. So the set is spelled out.
      # Narrowed by filterset like the test jobs, so the build keeps the
      # `--workspace` resolution main's cache holds; a scoped report covers only
      # the affected crates.
      - shell: bash
        env:
          FILTERSET: ${{ needs.scope.outputs.filterset }}
        run: >
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
          --no-default-features
          --features derive,serde,openai,claude,gemini,agent,rag,mem0,skills,mcp,browser,websearch,webfetch,search,fs,command
          --exclude aither-llama --exclude aither-ort
          --timings
          ${FILTERSET:+--no-tests=pass -E "$FILTERSET"}
      # cargo-llvm-cov builds into its own target directory.
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-ci-coverage
          path: target/llvm-cov-target/cargo-timings/
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # A coverage upload outage is not a reason to fail a build that
          # otherwise passed.
          fail_ci_if_error: false

  # ------------------------------------------------------------------- result
  result:
    # The one required check on `main`: green when every job it needs succeeded
    # or was skipped by the scope.
    name: CI result
    if: always()
    needs:
      - scope
      - audit
      - format
      - workflow-gates
      - unused-deps
      - lint
      - wasm
      - test-portability
      - test-apple
      - test-full
      - feature-checks
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::a needed job ended $result"
              exit 1
            fi
          done
