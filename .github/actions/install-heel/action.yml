name: Install Heel Runtime
description: Download the heel executable the tool distribution pins for the runner (patch/third-party-tools.json), verify its SHA-256, and export it as HEEL_BIN for steps that run heel itself rather than through aither-sandbox.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux) os=linux ;;
          macOS) os=macos ;;
          Windows) os=windows ;;
          *) echo "::error::no pinned heel for ${RUNNER_OS}"; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) arch=x86_64 ;;
          ARM64) arch=aarch64 ;;
          *) echo "::error::no pinned heel for ${RUNNER_ARCH}"; exit 1 ;;
        esac
        pin="$(jq -c --arg os "${os}" --arg arch "${arch}" \
          '[.host_programs[] | select(.tool == "heel" and .target.os == $os and .target.arch == $arch)]
           | if length == 1 then .[0] else error("expected one heel pin") end' \
          patch/third-party-tools.json)"
        executable="${RUNNER_TEMP}/heel-runtime/heel"
        if [[ "${os}" == windows ]]; then
          executable="${executable}.exe"
        fi
        mkdir -p "${RUNNER_TEMP}/heel-runtime"
        curl -fsSL "$(jq -r .url <<<"${pin}")" -o "${executable}"
        echo "$(jq -r .sha256 <<<"${pin}")  ${executable}" | (sha256sum -c - 2>/dev/null || shasum -a 256 -c -)
        chmod +x "${executable}"
        "${executable}" --version
        echo "HEEL_BIN=${executable}" >> "${GITHUB_ENV}"
